[project]
name = "tjcas"
version = "0.1.0"
description = "Taiwanese Judgments Citation Annotating System"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
